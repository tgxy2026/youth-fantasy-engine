# 青春幻想引擎 · 网页体验版 nginx 站点配置
# 部署：cp server/yfe.conf /etc/nginx/sites-available/yfe && ln -sf .../yfe /etc/nginx/sites-enabled/yfe
# 注意：把 server_name _ 改成你的域名后再申请 HTTPS（sudo certbot --nginx -d 域名）

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    # 自签证书（无域名场景下的 HTTPS，使浏览器 crypto.subtle 可用→云端真 AES-GCM 加密生效）
    # 浏览器会提示「证书不受信任」，高级→继续访问即可；正式上线请换 Let's Encrypt 真证书。
    ssl_certificate /etc/ssl/yfe/yfe.crt;
    ssl_certificate_key /etc/ssl/yfe/yfe.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/yfe;
    index index.html;

    # SPA 兜底：前端路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查（转发到反馈服务，便于外部探活）
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    # ===== AI 同源反代（解决浏览器 CORS）=====
    # 客户端把 https://<host>/v1 改写成 /api/ai/<host>/v1，此处转发回原站。
    # 仅白名单内的平台，避免被当成开放代理。服务器只转发、不记录请求体（access_log off）。
    # SSE 流式需要关闭缓冲、放宽读超时。
    location /api/ai/api.siliconflow.cn/ {
        proxy_pass https://api.siliconflow.cn/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/api.deepseek.com/ {
        proxy_pass https://api.deepseek.com/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/dashscope.aliyuncs.com/ {
        proxy_pass https://dashscope.aliyuncs.com/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/open.bigmodel.cn/ {
        proxy_pass https://open.bigmodel.cn/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/ark.cn-beijing.volces.com/ {
        proxy_pass https://ark.cn-beijing.volces.com/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/api.moonshot.cn/ {
        proxy_pass https://api.moonshot.cn/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/api.minimax.chat/ {
        proxy_pass https://api.minimax.chat/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/api.hunyuan.cloud.tencent.com/ {
        proxy_pass https://api.hunyuan.cloud.tencent.com/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/api.baichuan-ai.com/ {
        proxy_pass https://api.baichuan-ai.com/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/api.lingyiwanwu.com/ {
        proxy_pass https://api.lingyiwanwu.com/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/api.groq.com/ {
        proxy_pass https://api.groq.com/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/openrouter.ai/ {
        proxy_pass https://openrouter.ai/;
        include /etc/nginx/yfe_proxy_params;
    }
    location /api/ai/api.openai.com/ {
        proxy_pass https://api.openai.com/;
        include /etc/nginx/yfe_proxy_params;
    }

    # ===== 反馈 / 邀请校验：转发到本地反馈服务（默认 :3000）=====
    location /api/feedback {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/invite/check {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/sync {
        # 云端同步快照可能随项目增长超过默认 1m，必须放宽否则大项目推送被 nginx 直接 413 拦死
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
