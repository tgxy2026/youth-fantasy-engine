# ============ 网页版缓存策略（3.6.2 · W1）============
#
# 🔴🔴 2026-11-21 收尾实测：**线上这个片段从未生效，也不需要生效**。
#   服务器（115.120.232.153）的反代是 **Caddy**，不是 nginx：
#
#       youth-fantasy-engine.online {
#           reverse_proxy 127.0.0.1:8082
#       }
#
#   Caddy 全透传，`Cache-Control` 由 Node 服务自己发（`server/index.mjs` 的
#   `cacheControlFor()` 是唯一真源）。`/etc/nginx` 在这台机器上根本不存在。
#   保留本文件只为两种情况：将来真的迁回 nginx，或换到一台 nginx 机器上部署。
#   **改缓存口径请改 `cacheControlFor()`，改这里不会影响线上。**
#
#   （收尾时线上实测：`/` = no-store ✅；`/version.json` = public, max-age=31536000,
#    immutable ❌ —— 清单被永久缓存，刷新提示永远读不到新清单。已在 Node 侧修正。）
#
# ============ 以下为原始设计说明（nginx 迁移参考）============
#
# 【为什么入仓】缓存头是"用户到底看到哪一版"的唯一开关，却一直只存在于服务器上 ——
#   换机器、重装、回滚时它是最容易丢的一环。丢掉的表现很隐蔽：
#   用户长期看到旧页面、手册与 JS 混版本、明明发了新版却"没人看得见"。
#   配置入仓 = 可回放、可评审、可与 BUILD_ID 一起核对。
#
# 【怎么用】这是**片段**，由 nginx server 块 include 进来（不要整份替换站点配置）：
#
#     server {
#         listen 443 ssl http2;
#         server_name youth-fantasy-engine.online;
#         root /opt/yfe/www;
#         index index.html;
#
#         include /etc/nginx/snippets/yfe-cache.conf;   # ← 本文件
#
#         location /api/ { proxy_pass http://127.0.0.1:8787; }
#     }
#
# 🔴 三条口径（改动前先想清楚用户会看到什么）：
#   ① `index.html` 必须**每次验证**（no-cache + must-revalidate）：
#      它是"壳"，引用的 chunk 哈希每次构建都变。壳被缓存 = 用户永远加载旧版。
#      用 no-cache 而不是 no-store：允许存副本、每次回源验证（304 时省流量），语义足够。
#   ② `/assets/` 可以**永久缓存**（immutable）：文件名带内容哈希，内容一变文件名就变。
#      这一条是网页版"刷新即更新"能成立的前提 —— 否则每次发版都让用户重下几 MB。
#   ③ `version.json` 必须 no-cache：客户端靠它判断"线上是不是换版了、要不要提示刷新"。
#      被缓存住就等于把"有新版本"的提示关掉了。
#
# ⚠️ 关于 `/BUILD_ID`：**它不是公开端点**。`server/deploy.sh` 在打包前生成它，
#   远端 `server/scripts/deploy.sh` 解压后又把它 `mv` 到 `/opt/yfe/BUILD_ID.www`（第 71 行），
#   所以线上 `curl /BUILD_ID` 是 404 —— 这是设计如此，不要为了"让它可访问"去改部署脚本。
#   客户端判断"要不要刷新"读的是 `version.json` 里的 `webBuildId`。
#
# ⚠️ nginx 的 add_header 继承规则：**子级 location 一旦自己写了 add_header，
#   父级的 add_header 就不再继承**。所以每个 location 都要把需要的头写全，
#   别指望在 server 块顶端写一次就覆盖所有分支。

# ① HTML 外壳：每次回源验证
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# 根路径落到 index.html（SPA 入口），同样不快取
location = / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /index.html =404;
}

# ② 带内容哈希的静态资源：一年 + immutable
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# ③ 版本清单：每次现取（客户端据此判断"线上换版了没"）
location = /version.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Content-Type "application/json; charset=utf-8" always;
    try_files $uri =404;
}

# ④ 其余静态文件（图标、字体等）：短期缓存即可，别用 immutable —— 它们的文件名不带哈希
location ~* \.(?:ico|png|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}
