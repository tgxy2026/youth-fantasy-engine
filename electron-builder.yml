# 桌面（Windows 安装版）打包配置 —— 用法：npm run build:desktop
# 产物：release/desktop/青春幻想引擎-Setup-1.0.0.exe（NSIS 安装包）
# 🔴 appId 改动（2.9.3 → 3.0）= 新旧成为**两个独立 Windows 产品**，安装器不会自动卸载旧版；
#    老用户迁移走「卸载旧版 → 装新版 → 首启自动导入旧数据」（见 docs/3.0-开发方案.md §3 / §6）。
appId: cn.youthfantasyengine.yfe
productName: 青春幻想引擎
copyright: Copyright © 2026

directories:
  output: release/desktop
  buildResources: build

# 只打包运行所需文件：渲染产物 + Electron 主进程（依赖已全部内联进 dist，无需 node_modules）
files:
  - electron/**/*
  - dist/**/*
  - package.json

asar: true

# 🔴 只保留中英两套 Chromium 语言包（2026-10-07 · 2.9.0 重封时新增）。
# 【起因】解包目录里 `locales/` 有 **55 个语言包、合计 49 MB** —— 而本项目界面全中文，
#   不依赖 Chromium 自身的本地化字符串，其余 53 种是纯浪费。
#   2.9.0 把 Electron 升到 44 后主 exe 从 181MB 涨到 246MB，安装包随之从 81MB 涨到 **112.52MB**，
#   首次越过 Gitee Release 附件 **100 MB 单文件上限** ⇒ 不裁剪就传不上去。
electronLanguages:
  - zh-CN
  - en-US

# 裁掉 Electron 运行时里本项目用不到的组件（dxcompiler.dll 等，见该脚本顶部说明）。
# 🔴 必须挂 afterPack：它跑在「Electron 已解包、NSIS 尚未打」之间，删掉的文件不会进安装包。
afterPack: scripts/prune-electron-dist.cjs

# 🔴🔴 主 exe 的图标与版本元数据**不在 electron-builder 钩子里写**（2026-10-02 · 2.7.1 轮实测踩坑）。
#
# 【试过并放弃的方案】先后试过 afterPack 与 afterAllArtifactBuild 两个钩子，都不行：
#   · afterPack —— electron-builder 在它之后**还会再写一次主 exe**（exe 的 mtime 比钩子日志晚 5 秒），
#     把刚写好的元数据整体覆盖回默认值。`signAndEditExecutable: false` 只关掉它改「资源」，
#     关不掉它重写文件本身。
#   · afterAllArtifactBuild —— 时机够晚了，但钩子跑在 **electron-builder 自己的进程内**，
#     此时主 exe 仍被它占着，rcedit 写不进去：12 次重试全失败，写后校验始终查不到串。
#     （electron-builder 一退出、同一份产物手工跑 rcedit 立刻成功、体积精确回到基线。）
#
# 【现行方案】写入放到 scripts/build-desktop.mjs 里，在 **electron-builder 进程完全退出之后**执行 ——
#   那里 exe 已无人占用，rcedit 一次就能写进去。顺序：
#     electron-builder 打完包 → 校验主 exe → 缺失则补写 → 重打包让 exe 进包 → 再补一次 → 复验。
win:
  # 🔴 3.0 · D3：安装目录与主 exe 名由此决定（`Programs\YouthFantasyEngine\YouthFantasyEngine.exe`）。
  #    与包名形态解耦：productName 仍是中文显示名，executableName 只管文件系统里的目录/文件名。
  #    ⚠️ 设了它之后，win-unpacked 下的主 exe 从「青春幻想引擎.exe」变成「YouthFantasyEngine.exe」，
  #    `scripts/build-desktop.mjs` 里的 exePath 常量必须同步（否则元数据补写静默跳过 → 交付坏包）。
  executableName: YouthFantasyEngine
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 🔴 跳过 electron-builder 内置的 rcedit：本机它写主 exe 资源必报 `Fatal error: Unable to commit changes`，
  #    且 electron-builder 24.13.3 在重试 4 次耗尽后**直接中止整个构建（exit 1）**、NSIS 阶段不再执行
  #    （2026-10-02 实测连续 3 次；历史记录「失败但继续打包」已不成立）。本项目不做代码签名，
  #    跳过该步无副作用；主 exe 元数据由 afterAllArtifactBuild 钩子保证
  #    （实测体积 181,097,984 逐字节一致、含开发组名与版本串）。
  signAndEditExecutable: false

nsis:
  oneClick: false                # 非一键安装：可自选安装目录
  perMachine: false              # 按用户安装，无需管理员权限
  # 2.5.0 · B1 恢复自定义安装目录（社区反馈）。默认路径不变（仍是当前用户目录，无需管理员）；
  # 风险兜底 = 发布说明写明「装到无写权限的目录（如 Program Files）会因权限不足失败」，
  # 不做向导内权限探测（明确不做）。🔴 出包须实测三路径（默认装 / 自定义目录装 / 老版本覆盖升级），
  # 若覆盖升级路径漂移或卸载残留恶化 → 回滚本行为 false（见 docs/2.5.0-版本规划.md · B1 中止判据）。
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 青春幻想引擎
  artifactName: 青春幻想引擎-Setup-${version}.exe
