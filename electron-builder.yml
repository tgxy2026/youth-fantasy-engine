# 桌面（Windows 安装版）打包配置 —— 用法：npm run build:desktop
# 产物：release/desktop/青春幻想引擎-Setup-1.0.0.exe（NSIS 安装包）
# 🔴 appId 改动（2.9.3 → 3.0）= 新旧成为**两个独立 Windows 产品**，安装器不会自动卸载旧版；
#    老用户迁移走「卸载旧版 → 装新版 → 首启自动导入旧数据」（见 docs/3.0-开发方案.md §3 / §6）。
appId: cn.youthfantasyengine.yfe
productName: 青春幻想引擎
# 主 exe「属性 → 详细信息 → 公司」取自 package.json 的 `author`（appInfo.companyName = author.name，
# 当前为「青春幻想引擎开发组」，与 scripts/build-desktop.mjs 的 COMPANY 常量逐字一致）。
# ⚠️ 不要在 yml 里另写 companyName —— electron-builder 26 的配置 schema 没有这一项，会直接中止构建。
copyright: Copyright © 2026

directories:
  output: release/desktop
  buildResources: build

# 只打包运行所需文件：渲染产物 + Electron 主进程（依赖已全部内联进 dist，无需 node_modules）
files:
  - electron/**/*
  - dist/**/*
  - package.json

extraResources:
  - from: scripts/mcp/yfe-readonly-desktop.mjs
    to: scripts/mcp/yfe-readonly.mjs
  # 3.4.3：可写工具桥 + 宿主核心（桌面主进程动态 import）随包分发
  - from: scripts/mcp/yfe-agent.mjs
    to: scripts/mcp/yfe-agent.mjs
  - from: scripts/agent-host
    to: scripts/agent-host
  - from: docs/agent/MCP第三方开发者适配规范.md
    to: docs/agent/MCP第三方开发者适配规范.md
  - from: docs/agent/API与Agent互斥模式设计.md
    to: docs/agent/API与Agent互斥模式设计.md
  - from: docs/agent/README.md
    to: docs/agent/README.md

asar: true

# 🔴 只保留中英两套 Chromium 语言包（2026-10-07 · 2.9.0 重封时新增）。
# 【起因】解包目录里 `locales/` 有 **55 个语言包、合计 49 MB** —— 而本项目界面全中文，
#   不依赖 Chromium 自身的本地化字符串，其余 53 种是纯浪费。
#   2.9.0 把 Electron 升到 44 后主 exe 从 181MB 涨到 246MB，安装包随之从 81MB 涨到 **112.52MB**，
#   首次越过 Gitee Release 附件 **100 MB 单文件上限** ⇒ 不裁剪就传不上去。
electronLanguages:
  - zh-CN
  - en-US

# 裁掉 Electron 运行时里本项目用不到的组件（dxcompiler.dll 等，见该脚本顶部说明）。
# 🔴 必须挂 afterPack：它跑在「Electron 已解包、NSIS 尚未打」之间，删掉的文件不会进安装包。
afterPack: scripts/prune-electron-dist.cjs

# 🔴🔴 主 exe 的图标与版本元数据**交给 electron-builder 自己写**（2026-11-24 修正）。
#
# 【历史】2.7.1–3.7.0 一直用「关掉内置 rcedit + 外层手工补写」的绕法，起因是 2026-10-02
#   在 electron-builder **24.13.3** 上实测「它写主 exe 资源必报 Fatal error: Unable to commit
#   changes，重试 4 次耗尽后直接中止构建」。当时没有更细的开关，只能整段关掉。
#   副作用：每次封装都要人工在外层跑 rcedit + --prepackaged 重打，且 after-pack.cjs 那个
#   补写钩子**根本没挂到 afterAllArtifactBuild**（yml 里只有 afterPack），等于一直是死代码。
#
# 【现在】electron-builder 26 提供了更细的开关：
#   · `signAndEditExecutable: false` —— 资源编辑**与**签名一起跳过（旧行为，会导致 exe 无图标无版本）；
#   · `signExecutable: false`        —— **只跳过签名，保留资源编辑**（图标 + 版本/公司/产品名照写）。
#   app-builder-lib/out/winPackager.js:236 的分支确认：设了它仍会走 signAndEditResources()。
#   本项目不做代码签名，故用后者即可让 exe 元数据在打包阶段一次写对，不再需要外层补救。
win:
  # 🔴 3.0 · D3：安装目录与主 exe 名由此决定（`Programs\YouthFantasyEngine\YouthFantasyEngine.exe`）。
  #    与包名形态解耦：productName 仍是中文显示名，executableName 只管文件系统里的目录/文件名。
  #    ⚠️ 设了它之后，win-unpacked 下的主 exe 从「青春幻想引擎.exe」变成「YouthFantasyEngine.exe」，
  #    `scripts/build-desktop.mjs` 里的 exePath 常量必须同步（否则元数据补写静默跳过 → 交付坏包）。
  executableName: YouthFantasyEngine
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 只跳过代码签名，保留图标与版本元数据写入（见上）
  signExecutable: false

nsis:
  oneClick: false                # 非一键安装：可自选安装目录
  perMachine: false              # 按用户安装，无需管理员权限
  # 2.5.0 · B1 恢复自定义安装目录（社区反馈）。默认路径不变（仍是当前用户目录，无需管理员）；
  # 风险兜底 = 发布说明写明「装到无写权限的目录（如 Program Files）会因权限不足失败」，
  # 不做向导内权限探测（明确不做）。🔴 出包须实测三路径（默认装 / 自定义目录装 / 老版本覆盖升级），
  # 若覆盖升级路径漂移或卸载残留恶化 → 回滚本行为 false（见 docs/2.5.0-版本规划.md · B1 中止判据）。
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 青春幻想引擎
  artifactName: 青春幻想引擎-Setup-${version}.exe
